<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spooky Audio Player</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Medieval+Sharp&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap&family=Carrois+Gothic+SC&display=swap&family=Rubik:wght@400;600&display=swap&family=Orbitron&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />

<!-- Your CSS -->
<link rel="stylesheet" href="styles/layout.css" />
<link id="theme-link" rel="stylesheet" href="styles/styles.css" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
  }

  #controlArea {
    width: 160px;
    min-width: 160px;
    height: 100vh;
    background: rgba(0, 0, 0, 0.9);
    border-left: 2px solid #00ff00;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1rem 0;
    box-sizing: border-box;
    z-index: 1100;
    user-select: none;
  }

  .center-wrapper {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0 1rem;
    box-sizing: border-box;
    overflow-x: hidden;
    height: 100vh;
    position: relative;
  }

  #controlPlayButton {
    width: 48px;
    height: 48px;
    background: url('https://img.icons8.com/ios-filled/50/00ff00/play--v1.png') no-repeat center;
    background-size: contain;
    cursor: pointer;
    transition: background-image 0.3s ease;
    z-index: 2;
  }

  #controlPlayButton.playing {
    background-image: url('https://img.icons8.com/ios-filled/50/00ff00/pause--v1.png');
  }

  #playlistPanel {
    width: 100%;
    max-height: calc(50% - 60px);
    overflow-y: auto;
    background: #111;
    border-bottom: 1px solid #00ff00;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }

  .playlist-title {
    color: #00ff00;
    font-weight: 700;
    padding: 0.5rem 1rem;
    font-family: 'Orbitron', sans-serif;
    background: #000;
    border-bottom: 1px solid #004400;
  }

  .playlist-entry {
    padding: 0.3rem 1rem;
    color: #ccc;
    cursor: pointer;
    border-bottom: 1px solid #002200;
    user-select: none;
  }

  .playlist-entry:hover {
    background: #003300;
    color: #00ff00;
  }

  #skinList {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    color: #00ff00;
    position: absolute;
    bottom: 0;
    left: 0;
    background: #000;
    border-top: 1px solid #00ff00;
  }

  #skinList li {
    padding: 0.4rem 1rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: border-color 0.3s ease;
  }

  #skinList li:hover,
  #skinList li.active {
    border-left-color: #00ff00;
    background: #002200;
  }

  #skinSelect {
    display: none !important;
  }

  .feather-container {
    pointer-events: none;
    overflow: visible;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100vh;
    z-index: 50;
  }
</style>
</head>
<body>

<video id="metalBgVideo" autoplay muted loop playsinline style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-1;">
  <source src="https://www.dropbox.com/scl/fi/92390f6gk9vs09i0q9133/172090-846482763.mp4?rlkey=tkuh9m9r8pi4osph44d1n882h&raw=1" type="video/mp4" />
</video>

<select id="skinSelect">
  <option value="styles/styles" selected>Default</option>
  <option value="styles/skin-retro">Retro</option>
  <option value="styles/skin-angel">Angel</option>
  <option value="styles/skin-haunted">Haunted</option>
  <option value="styles/skin-metal">Metal</option>
  <option value="styles/skin-steel">Steel</option>
  <option value="styles/skin-neon">Neon</option>
  <option value="styles/skin-storytellerz">Storytellerz</option>
</select>

<div id="controlArea" aria-label="Control Area">
  <div id="playlistPanel" aria-label="Playlist Panel">
    <div class="playlist-title">PLAYLIST</div>
    <div id="playlistEntries"></div>
  </div>
  <div id="controlPlayButton" title="Play / Pause"></div>
  <ul id="skinList" aria-label="Skin Selection">
    <li data-skin="styles/styles" class="active">Default</li>
    <li data-skin="styles/skin-retro">Retro</li>
    <li data-skin="styles/skin-angel">Angel</li>
    <li data-skin="styles/skin-haunted">Haunted</li>
    <li data-skin="styles/skin-metal">Metal</li>
    <li data-skin="styles/skin-steel">Steel</li>
    <li data-skin="styles/skin-neon">Neon</li>
    <li data-skin="styles/skin-storytellerz">Storytellerz</li>
  </ul>
</div>

<div class="feather-container"></div>

<div class="center-wrapper">
  <div class="container">
    <div class="left-section">
      <div class="lyrics-box" id="lyricsBox">
        <div class="lyrics-inner" id="lyricsInner">Loading lyrics…</div>
      </div>
      <div class="player-wrapper">
        <div class="play-button" id="playButton" style="display:none;"></div>
        <div class="custom-player">
          <div class="time" id="currentTime">0:00</div>
          <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressFill"></div>
          </div>
          <div class="time" id="duration">0:00</div>
        </div>
      </div>
    </div>
    <div class="metadata">
      <img id="coverArt" class="cover" src="" alt="Cover Art" />
      <div class="metadata-card">
        <div class="scale-wrapper">
          <div class="title" id="songTitle">Loading title…</div>
        </div>
        <div class="scale-wrapper">
          <div class="artist" id="artistName">Loading artist…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="audioPlayer"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="scripts/script.js"></script>
</body>
</html>
