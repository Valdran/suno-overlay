<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spooky Audio Player</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Medieval+Sharp&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap&family=Carrois+Gothic+SC&display=swap&family=Rubik:wght@400;600&display=swap&family=Orbitron&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <!-- Add this line BEFORE the theme link -->
  <link rel="stylesheet" href="styles/layout.css" />

  <!-- Existing dynamic skin link -->
  <link id="theme-link" rel="stylesheet" href="styles/styles.css">

  <style>
    /* Control Area container on right */
    #controlArea {
      position: fixed;
      top: 0;
      right: 0;
      width: 140px;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 1000;
      box-shadow: inset 0 0 10px #000;
      user-select: none;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }
    /* Push main UI left so it does not overlap Control Area */
    .center-wrapper {
      padding-right: 140px; /* same as #controlArea width */
    }
    /* Playlist panel positioning */
    #playlistPanel {
      position: fixed;
      right: 140px; /* directly left of Control Area */
      bottom: 80px; /* above playlist button */
      width: 140px;
      background: rgba(0,0,0,0.95);
      border: 2px solid #00ff00;
      color: #00ff00;
      font-family: 'Orbitron', sans-serif;
      padding: 0.5rem;
      display: none;
      flex-direction: column;
      max-height: 300px;
      overflow-y: auto;
      z-index: 999;
    }
    /* Center icons horizontally */
    #playButton, #playlistToggleButton {
      width: 48px;
      height: 48px;
      cursor: pointer;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      filter: drop-shadow(0 0 1px black);
    }
    /* White icon with black outline from flaticon */
    #playButton.paused {
      background-image: url('https://cdn-icons-png.flaticon.com/512/64/64595.png'); /* white play icon with black outline */
    }
    #playButton.playing {
      background-image: url('https://cdn-icons-png.flaticon.com/512/64/64981.png'); /* white pause icon with black outline */
    }
    #playlistToggleButton {
      background-image: url('https://cdn-icons-png.flaticon.com/512/1828/1828859.png'); /* white menu icon with black outline */
    }
    /* Skin list styles */
    #skinList {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      color: white;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      text-align: center;
      user-select: none;
      cursor: pointer;
      max-height: 220px;
      overflow-y: auto;
      width: 100%;
      padding-left: 0;
      margin: 0;
    }
    #skinList div:hover {
      color: #00ff00;
      text-shadow: 0 0 5px #00ff00;
    }
    /* Prevent feathers container from entering control area */
    .feather-container {
      pointer-events: none;
      margin-right: 140px; /* Prevent overlapping with control area */
    }
  </style>
</head>
<body>

<video id="metalBgVideo" autoplay muted loop playsinline
  style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1;">
  <source src="https://www.dropbox.com/scl/fi/92390f6gk9vs09i0q9133/172090-846482763.mp4?rlkey=tkuh9m9r8pi4osph44d1n882h&raw=1" type="video/mp4" />
</video>

<!-- New Control Area on the right -->
<div id="controlArea">

  <!-- Play/Pause Button -->
  <div id="playButton" class="paused" aria-label="Play/Pause Button" role="button" tabindex="0"></div>

  <!-- Skin list as vertical buttons -->
  <div id="skinList" aria-label="Skin Selector">
    <div data-skin="styles/styles">Default</div>
    <div data-skin="styles/skin-retro">Retro</div>
    <div data-skin="styles/skin-angel">Angel</div>
    <div data-skin="styles/skin-haunted">Haunted</div>
    <div data-skin="styles/skin-metal">Metal</div>
    <div data-skin="styles/skin-steel">Steel</div>
    <div data-skin="styles/skin-neon">Neon</div>
    <div data-skin="styles/skin-storytellerz">Storytellerz</div>
  </div>

  <!-- Playlist Toggle Button -->
  <div id="playlistToggleButton" aria-label="Toggle Playlist" role="button" tabindex="0"></div>

</div>

<!-- Playlist panel -->
<div class="feather-container">
  <div class="feather f1"></div>
  <div class="feather f2"></div>
  <div class="feather f3"></div>
  <div class="feather f4"></div>
  <div class="feather f5"></div>
</div>

<!-- Wrapper to center the UI and prevent shifting -->
<div class="center-wrapper">
  <div class="container">
    <div class="left-section">
      <div class="lyrics-box" id="lyricsBox">
        <div class="lyrics-inner" id="lyricsInner">Loading lyrics…</div>
      </div>

      <div class="player-wrapper">
        <div class="playlist-panel" id="playlistPanel">
          <div class="playlist-title">PLAYLIST</div>
          <div id="playlistEntries"></div>
        </div>

        <div class="custom-player">
          <!-- Play button removed from here -->
          <div class="time" id="currentTime">0:00</div>
          <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressFill"></div>
          </div>
          <div class="time" id="duration">0:00</div>
        </div>
      </div>
    </div>

    <div class="metadata">
      <img id="coverArt" class="cover" src="" alt="Cover Art" />
      <div class="metadata-card">
        <div class="scale-wrapper">
          <div class="title" id="songTitle">Loading title…</div>
        </div>
        <div class="scale-wrapper">
          <div class="artist" id="artistName">Loading artist…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Audio Element -->
<audio id="audioPlayer"></audio>

<!-- CSV Parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Main Script -->
<script src="scripts/script.js"></script>

<script>
  // Keep play/pause toggle logic consistent with new button in Control Area
  const playBtn = document.getElementById('playButton');
  const audio = document.getElementById('audioPlayer');
  const playlistToggleButton = document.getElementById('playlistToggleButton');
  const playlistPanel = document.getElementById('playlistPanel');
  const skinList = document.getElementById('skinList');
  const themeLink = document.getElementById('theme-link');
  const metalBgVideo = document.getElementById('metalBgVideo');
  const body = document.body;

  audio.onplay = () => {
    playBtn.classList.remove('paused');
    playBtn.classList.add('playing');
  };
  audio.onpause = () => {
    playBtn.classList.remove('playing');
    playBtn.classList.add('paused');
  };

  playBtn.addEventListener('click', () => {
    if (audio.paused) audio.play();
    else audio.pause();
  });

  playlistToggleButton.addEventListener('click', () => {
    if (playlistPanel.style.display === 'flex' || playlistPanel.style.display === 'block') {
      playlistPanel.style.display = 'none';
    } else {
      playlistPanel.style.display = 'flex';
      playlistPanel.style.flexDirection = 'column';
    }
  });

  skinList.querySelectorAll('div').forEach(skinDiv => {
    skinDiv.addEventListener('click', () => {
      const skinPath = skinDiv.getAttribute('data-skin');
      themeLink.href = skinPath + '.css';

      // Update body class for skin
      const match = skinPath.match(/skin-(\w+)/);
      const skinClass = match ? `theme-${match[0]}` : '';
      body.className = skinClass;

      // Show/hide metalBgVideo based on skin
      if (metalBgVideo) {
        metalBgVideo.style.display = (skinClass === 'theme-skin-metal') ? 'block' : 'none';
      }

      // Start/stop feathers based on skin
      if (skinClass === 'theme-skin-angel') {
        if (typeof startFeathers === 'function') startFeathers();
      } else {
        if (typeof stopFeathers === 'function') stopFeathers();
      }
    });
  });
</script>

</body>
</html>
