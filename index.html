<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spooky Audio Player</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Medieval+Sharp&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap&family=Carrois+Gothic+SC&display=swap&family=Rubik:wght@400;600&display=swap&family=Orbitron&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <!-- Add this line BEFORE the theme link -->
  <link rel="stylesheet" href="styles/layout.css" />

  <!-- Existing dynamic skin link -->
  <link id="theme-link" rel="stylesheet" href="styles/styles.css">

  <style>
    /* New styles for Control Area and layout adjustments */

    body {
      overflow-x: hidden; /* prevent horizontal scroll */
    }

    /* Control Area on right */
    #controlArea {
      position: fixed;
      top: 0;
      right: 0;
      width: 140px; /* width of control area */
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      border-left: 2px solid #00ff00;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
      box-sizing: border-box;
      z-index: 1100;
      user-select: none;
    }

    /* Push existing UI left so it does not overlap control area */
    .center-wrapper {
      margin-right: 140px; /* same as controlArea width */
    }

    /* Play/Pause button in control area - vertically centered */
    #controlPlayButton {
      width: 48px;
      height: 48px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/27/27223.png'); /* white play icon with black outline */
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      cursor: pointer;
      margin: auto 0; /* vertical center */
      transition: background-image 0.3s ease;
    }
    #controlPlayButton.paused {
      background-image: url('https://cdn-icons-png.flaticon.com/512/27/27225.png'); /* white pause icon with black outline */
    }

    /* Playlist toggle button moved inside control area */
    #playlistToggleButton {
      position: static !important; /* override fixed positioning */
      width: 32px !important;
      height: 32px !important;
      margin-bottom: 1rem;
      background: url('https://cdn-icons-png.flaticon.com/512/1828/1828859.png') no-repeat center;
      background-size: contain;
      filter: none !important; /* remove old glow */
      cursor: pointer;
      user-select: none;
    }

    /* Playlist panel above playlist button */
    #playlistPanel {
      position: relative;
      width: 100%;
      max-height: 50vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid #00ff00;
      display: none; /* hidden initially */
      flex-direction: column;
      box-sizing: border-box;
      margin-bottom: 0.5rem;
      z-index: 1200;
    }
    #playlistPanel.visible {
      display: flex;
    }
    #playlistPanel.fadeout {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Playlist title */
    .playlist-title {
      padding: 0.5rem 1rem;
      font-weight: 700;
      color: #00ff00;
      border-bottom: 1px solid #00ff00;
      user-select: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
    }

    /* Playlist entries */
    .playlist-entry {
      padding: 0.3rem 1rem;
      color: #ccc;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      font-size: 0.9rem;
      border-bottom: 1px solid #002200;
      user-select: none;
    }
    .playlist-entry:hover {
      background: #003300;
      color: #00ff00;
    }

    /* Vertical skin list inside control area */
    #skinList {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0 0;
      width: 100%;
      color: #00ff00;
      font-family: 'Rubik', sans-serif;
      font-weight: 600;
      user-select: none;
    }
    #skinList li {
      padding: 0.4rem 1rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: border-color 0.3s ease;
    }
    #skinList li:hover,
    #skinList li.active {
      border-left-color: #00ff00;
      background: #002200;
    }

    /* Prevent feathers from overlapping control area */
    .feather-container {
      pointer-events: none; /* feathers non-interactive */
      overflow: visible;
      position: fixed;
      top: 0;
      left: 0;
      right: 140px; /* restrict feathers so they don't go under control area */
      height: 100vh;
      z-index: 50;
    }
  </style>

</head>
<body>

<video id="metalBgVideo" autoplay muted loop playsinline
  style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1;">
  <source src="https://www.dropbox.com/scl/fi/92390f6gk9vs09i0q9133/172090-846482763.mp4?rlkey=tkuh9m9r8pi4osph44d1n882h&raw=1" type="video/mp4" />
</video>

<!-- Control Area on right -->
<div id="controlArea" aria-label="Control Area">

  <!-- Play/Pause button vertically centered -->
  <div id="controlPlayButton" title="Play / Pause"></div>

  <!-- Playlist panel above playlist button -->
  <div id="playlistPanel" aria-label="Playlist Panel">
    <div class="playlist-title">PLAYLIST</div>
    <div id="playlistEntries"></div>
  </div>

  <!-- Playlist toggle button -->
  <div id="playlistToggleButton" title="Toggle Playlist"></div>

  <!-- Vertical skin list -->
  <ul id="skinList" aria-label="Skin Selection">
    <li data-skin="styles/styles" class="active">Default</li>
    <li data-skin="styles/skin-retro">Retro</li>
    <li data-skin="styles/skin-angel">Angel</li>
    <li data-skin="styles/skin-haunted">Haunted</li>
    <li data-skin="styles/skin-metal">Metal</li>
    <li data-skin="styles/skin-steel">Steel</li>
    <li data-skin="styles/skin-neon">Neon</li>
    <li data-skin="styles/skin-storytellerz">Storytellerz</li>
  </ul>

</div>

<!-- Floating Feathers / Skulls -->
<div class="feather-container">
  <div class="feather f1"></div>
  <div class="feather f2"></div>
  <div class="feather f3"></div>
  <div class="feather f4"></div>
  <div class="feather f5"></div>
</div>

<!-- Wrapper to center the UI and prevent shifting -->
<div class="center-wrapper">
  <div class="container">
    <div class="left-section">
      <div class="lyrics-box" id="lyricsBox">
        <div class="lyrics-inner" id="lyricsInner">Loading lyrics…</div>
      </div>

      <div class="player-wrapper">
        <!-- Playlist panel is now inside control area so remove here or keep hidden -->
        <div class="playlist-panel" id="playlistPanel-left" style="display:none;">
          <div class="playlist-title">PLAYLIST</div>
          <div id="playlistEntries-left"></div>
        </div>

        <div class="custom-player">
          <div class="play-button" id="playButton" style="display:none;"></div> <!-- Hide old play button -->
          <div class="time" id="currentTime">0:00</div>
          <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressFill"></div>
          </div>
          <div class="time" id="duration">0:00</div>
        </div>
      </div>
    </div>

    <div class="metadata">
      <img id="coverArt" class="cover" src="" alt="Cover Art" />
      <div class="metadata-card">
        <div class="scale-wrapper">
          <div class="title" id="songTitle">Loading title…</div>
        </div>
        <div class="scale-wrapper">
          <div class="artist" id="artistName">Loading artist…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Audio Element -->
<audio id="audioPlayer"></audio>

<!-- CSV Parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Main Script -->
<script src="scripts/script.js"></script>

<script>
  // --- Sync controlPlayButton with audio play/pause ---
  const audio = document.getElementById('audioPlayer');
  const controlPlayBtn = document.getElementById('controlPlayButton');
  const playlistToggleButton = document.getElementById('playlistToggleButton');
  const playlistPanel = document.getElementById('playlistPanel');
  const skinList = document.getElementById('skinList');
  const themeLink = document.getElementById('theme-link');
  const body = document.body;
  const metalBgVideo = document.getElementById('metalBgVideo');

  // Play/pause toggle from control area button
  controlPlayBtn.addEventListener('click', () => {
    if (audio.paused) audio.play();
    else audio.pause();
  });

  // Update icon on play/pause
  audio.onplay = () => {
    controlPlayBtn.classList.add('paused');
  };
  audio.onpause = () => {
    controlPlayBtn.classList.remove('paused');
  };

  // Playlist toggle logic
  playlistToggleButton.addEventListener('click', () => {
    if (playlistPanel.classList.contains('visible')) {
      playlistPanel.classList.remove('visible');
      playlistPanel.classList.add('fadeout');
      setTimeout(() => (playlistPanel.style.display = 'none'), 300);
    } else {
      playlistPanel.style.display = 'flex';
      playlistPanel.classList.remove('fadeout');
      playlistPanel.classList.add('visible');
    }
  });

  // Skin selection logic
  skinList.querySelectorAll('li').forEach((li) => {
    li.addEventListener('click', () => {
      // Remove active from all
      skinList.querySelectorAll('li').forEach(el => el.classList.remove('active'));
      li.classList.add('active');

      const skinPath = li.dataset.skin;
      themeLink.href = skinPath + '.css';

      // Update body class to toggle skins
      const match = skinPath.match(/skin-(\w+)/);
      const skinClass = match ? `theme-${match[0]}` : '';
      body.className = skinClass;

      // Fire background video toggle for metal skin
      if (metalBgVideo) {
        if (skinClass === 'theme-skin-metal') {
          metalBgVideo.style.display = 'block';
        } else {
          metalBgVideo.style.display = 'none';
        }
      }
    });
  });

  // Initialize skin list active item based on current href
  (() => {
    const currentSkin = themeLink.href.split('/').pop().replace('.css', '');
    const matchingLi = Array.from(skinList.children).find(li => li.dataset.skin.endsWith(currentSkin));
    if (matchingLi) {
      skinList.querySelectorAll('li').forEach(el => el.classList.remove('active'));
      matchingLi.classList.add('active');
    }
  })();
</script>

</body>
</html>
