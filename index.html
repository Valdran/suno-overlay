<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spooky Audio Player</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Medieval+Sharp&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap&family=Carrois+Gothic+SC&display=swap&family=Rubik:wght@400;600&display=swap&family=Orbitron&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <!-- Add this line BEFORE the theme link -->
  <link rel="stylesheet" href="styles/layout.css" />

  <!-- Existing dynamic skin link -->
  <link id="theme-link" rel="stylesheet" href="styles/styles.css">

  <style>
    /* Control Area on right */
    #controlArea {
      position: fixed;
      top: 0;
      right: 0;
      width: 140px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      border-left: 2px solid #00ff00;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
      box-sizing: border-box;
      z-index: 1100;
      user-select: none;
    }

    /* Push main UI left */
    .center-wrapper {
      margin-right: 140px;
    }

    /* Play/Pause button in control area */
    #controlPlayButton {
      width: 48px;
      height: 48px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/27/27223.png'); /* play icon */
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      cursor: pointer;
      margin: auto 0;
      transition: background-image 0.3s ease;
    }
    #controlPlayButton.paused {
      background-image: url('https://cdn-icons-png.flaticon.com/512/27/27225.png'); /* pause icon */
    }

    /* Playlist toggle button inside control area */
    #playlistToggleButton {
      width: 32px !important;
      height: 32px !important;
      margin-bottom: 1rem;
      background: url('https://cdn-icons-png.flaticon.com/512/1828/1828859.png') no-repeat center;
      background-size: contain;
      cursor: pointer;
      user-select: none;
    }

    /* Playlist panel inside control area */
    #playlistPanel {
      position: relative;
      width: 100%;
      max-height: 50vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid #00ff00;
      display: none; /* hidden initially */
      flex-direction: column;
      box-sizing: border-box;
      margin-bottom: 0.5rem;
      z-index: 1200;
    }
    #playlistPanel.visible {
      display: flex;
    }
    #playlistPanel.fadeout {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Playlist title */
    .playlist-title {
      padding: 0.5rem 1rem;
      font-weight: 700;
      color: #00ff00;
      border-bottom: 1px solid #00ff00;
      user-select: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
    }

    /* Playlist entries */
    .playlist-entry {
      padding: 0.3rem 1rem;
      color: #ccc;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      font-size: 0.9rem;
      border-bottom: 1px solid #002200;
      user-select: none;
    }
    .playlist-entry:hover {
      background: #003300;
      color: #00ff00;
    }

    /* Vertical skin list */
    #skinList {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0 0;
      width: 100%;
      color: #00ff00;
      font-family: 'Rubik', sans-serif;
      font-weight: 600;
      user-select: none;
    }
    #skinList li {
      padding: 0.4rem 1rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: border-color 0.3s ease;
    }
    #skinList li:hover,
    #skinList li.active {
      border-left-color: #00ff00;
      background: #002200;
    }

    /* Hide original skinSelect but keep it in DOM */
    #skinSelect {
      display: none !important;
    }

    /* Prevent feathers overlapping control area */
    .feather-container {
      pointer-events: none;
      overflow: visible;
      position: fixed;
      top: 0;
      left: 0;
      right: 140px;
      height: 100vh;
      z-index: 50;
    }
  </style>
</head>
<body>

<video id="metalBgVideo" autoplay muted loop playsinline
  style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1;">

</video>

<!-- Skin Switcher UI -->
<div id="skinControl" style="position: fixed; top: 1rem; right: 1rem; z-index: 1000; display:none;">
  <!-- Hidden original easel and select removed from UI -->
  <select id="skinSelect">
    <option value="styles/styles" selected>Default</option>
    <option value="styles/skin-retro">Retro</option>
    <option value="styles/skin-angel">Angel</option>
    <option value="styles/skin-haunted">Haunted</option>
    <option value="styles/skin-metal">Metal</option>
    <option value="styles/skin-steel">Steel</option>
    <option value="styles/skin-neon">Neon</option>
    <option value="styles/skin-storytellerz">Storytellerz</option>
  </select>
</div>

<!-- Floating Feathers / Skulls -->
<div class="feather-container">
  <div class="feather f1"></div>
  <div class="feather f2"></div>
  <div class="feather f3"></div>
  <div class="feather f4"></div>
  <div class="feather f5"></div>
</div>

<!-- Control Area -->
<div id="controlArea" aria-label="Control Area">

  <!-- Play/Pause button -->
  <div id="controlPlayButton" title="Play / Pause"></div>

  <!-- Playlist panel -->
  <div id="playlistPanel" aria-label="Playlist Panel">
    <div class="playlist-title">PLAYLIST</div>
    <div id="playlistEntries"></div>
  </div>

  <!-- Playlist toggle button -->
  <div id="playlistToggleButton" title="Toggle Playlist"></div>

  <!-- Vertical skin list -->
  <ul id="skinList" aria-label="Skin Selection">
    <li data-skin="styles/styles" class="active">Default</li>
    <li data-skin="styles/skin-retro">Retro</li>
    <li data-skin="styles/skin-angel">Angel</li>
    <li data-skin="styles/skin-haunted">Haunted</li>
    <li data-skin="styles/skin-metal">Metal</li>
    <li data-skin="styles/skin-steel">Steel</li>
    <li data-skin="styles/skin-neon">Neon</li>
    <li data-skin="styles/skin-storytellerz">Storytellerz</li>
  </ul>
</div>

<!-- Wrapper to center the UI and prevent shifting -->
<div class="center-wrapper">
  <div class="container">
    <div class="left-section">
      <div class="lyrics-box" id="lyricsBox">
        <div class="lyrics-inner" id="lyricsInner">Loading lyrics…</div>
      </div>

      <div class="player-wrapper">
        <!-- Original play button hidden but present for scripts -->
        <div class="play-button" id="playButton" style="display:none;"></div>

        <div class="custom-player">
          <div class="time" id="currentTime">0:00</div>
          <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressFill"></div>
          </div>
          <div class="time" id="duration">0:00</div>
        </div>
      </div>
    </div>

    <div class="metadata">
      <img id="coverArt" class="cover" src="" alt="Cover Art" />
      <div class="metadata-card">
        <div class="scale-wrapper">
          <div class="title" id="songTitle">Loading title…</div>
        </div>
        <div class="scale-wrapper">
          <div class="artist" id="artistName">Loading artist…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Audio Element -->
<audio id="audioPlayer"></audio>

<!-- CSV Parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Main Script -->
<script src="scripts/script.js"></script>

  const themeLink = document.getElementById('theme-link');
  const body = document.body;
  const metalBgVideo = document.getElementById('metalBgVideo');
