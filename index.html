<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spooky Audio Player</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Medieval+Sharp&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap&family=Carrois+Gothic+SC&display=swap&family=Rubik:wght@400;600&display=swap&family=Orbitron&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/layout.css" />
  <link id="theme-link" rel="stylesheet" href="styles/styles.css">
</head>
<body>

<!-- Background Video -->
<video id="metalBgVideo" autoplay muted loop playsinline
  style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1;">
  <source src="https://www.dropbox.com/scl/fi/92390f6gk9vs09i0q9133/172090-846482763.mp4?rlkey=tkuh9m9r8pi4osph44d1n882h&raw=1" type="video/mp4" />
</video>

<!-- RIGHT CONTROL AREA -->
<div class="control-area" style="position: fixed; top: 0; right: 0; width: 120px; height: 100vh; background: rgba(0,0,0,0.9); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; box-shadow: inset 0 0 8px #000;">

  <!-- Play/Pause Button -->
  <div id="playButton" style="width: 48px; height: 48px; background: url('https://cdn-icons-png.flaticon.com/512/4211/4211750.png') center/contain no-repeat; cursor: pointer;"></div>

  <!-- Skins List -->
  <div id="skinList" style="display: flex; flex-direction: column; align-items: center; font-family: Orbitron; font-size: 0.75rem; color: white; gap: 0.3rem;">
    <div class="skin-option" data-skin="styles/styles" style="cursor:pointer;">Default</div>
    <div class="skin-option" data-skin="styles/skin-retro" style="cursor:pointer;">Retro</div>
    <div class="skin-option" data-skin="styles/skin-angel" style="cursor:pointer;">Angel</div>
    <div class="skin-option" data-skin="styles/skin-haunted" style="cursor:pointer;">Haunted</div>
    <div class="skin-option" data-skin="styles/skin-metal" style="cursor:pointer;">Metal</div>
    <div class="skin-option" data-skin="styles/skin-steel" style="cursor:pointer;">Steel</div>
    <div class="skin-option" data-skin="styles/skin-neon" style="cursor:pointer;">Neon</div>
    <div class="skin-option" data-skin="styles/skin-storytellerz" style="cursor:pointer;">Storytellerz</div>
  </div>

  <!-- Playlist Toggle Button -->
  <div id="playlistToggleButton" style="width: 32px; height: 32px; background: url('https://cdn-icons-png.flaticon.com/512/1828/1828859.png') center/contain no-repeat; cursor: pointer; margin-top: auto;"></div>
</div>

<!-- PLAYLIST PANEL -->
<div class="playlist-panel" id="playlistPanel" style="position: fixed; right: 120px; bottom: 80px; width: 120px; background: rgba(0,0,0,0.95); color: #00ff00; border: 2px solid #00ff00; display: none; flex-direction: column; padding: 0.5rem; font-family: Orbitron; z-index: 998; max-height: 300px; overflow-y: auto;">
  <div class="playlist-title" style="text-align: center; font-weight: bold; margin-bottom: 0.5rem;">PLAYLIST</div>
  <div id="playlistEntries"></div>
</div>

<!-- Feathers Container -->
<div class="feather-container" style="pointer-events: none;"></div>

<!-- MAIN UI WRAPPER, shifted left -->
<div class="center-wrapper" style="padding-right: 130px;">
  <div class="container">
    <div class="left-section">
      <div class="lyrics-box" id="lyricsBox">
        <div class="lyrics-inner" id="lyricsInner">Loading lyrics…</div>
      </div>

      <div class="player-wrapper">
        <div class="custom-player">
          <div class="time" id="currentTime">0:00</div>
          <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressFill"></div>
          </div>
          <div class="time" id="duration">0:00</div>
        </div>
      </div>
    </div>

    <div class="metadata">
      <img id="coverArt" class="cover" src="" alt="Cover Art" />
      <div class="metadata-card">
        <div class="scale-wrapper">
          <div class="title" id="songTitle">Loading title…</div>
        </div>
        <div class="scale-wrapper">
          <div class="artist" id="artistName">Loading artist…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- AUDIO ELEMENT -->
<audio id="audioPlayer"></audio>

<!-- CSV PARSER -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- YOUR MAIN SCRIPT -->
<script src="scripts/script.js"></script>

<!-- INLINE SCRIPT: Skin + Playlist logic -->
<script>
  // Skin Switching
  document.querySelectorAll('.skin-option').forEach(option => {
    option.addEventListener('click', () => {
      const skin = option.getAttribute('data-skin');
      document.getElementById('theme-link').href = skin + '.css';

      const body = document.body;
      const match = skin.match(/skin-(\w+)/);
      const skinClass = match ? `theme-${match[0]}` : '';
      body.className = skinClass;

      const metalBgVideo = document.getElementById('metalBgVideo');
      if (metalBgVideo) {
        metalBgVideo.style.display = (skinClass === 'theme-skin-metal') ? 'block' : 'none';
      }

      if (skinClass === 'theme-skin-angel') {
        startFeathers?.();
      } else {
        stopFeathers?.();
      }
    });
  });

  // Playlist toggle
  document.getElementById('playlistToggleButton').addEventListener('click', () => {
    const panel = document.getElementById('playlistPanel');
    panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
  });
</script>

</body>
</html>
