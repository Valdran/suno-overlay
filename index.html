<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spooky Audio Player</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Medieval+Sharp&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap&family=Carrois+Gothic+SC&display=swap&family=Rubik:wght@400;600&display=swap&family=Orbitron&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />

<!-- Your CSS -->
<link rel="stylesheet" href="styles/layout.css" />
<link id="theme-link" rel="stylesheet" href="styles/styles.css" />

<style>
  /* Control Area fixed on right */
  #controlArea {
    position: fixed;
    top: 0;
    right: 0;
    width: 160px;
    height: 100vh;
    background: rgba(0,0,0,0.9);
    border-left: 2px solid #00ff00;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 0;
    box-sizing: border-box;
    z-index: 1100;
    user-select: none;
  }
  /* Push main UI left so it doesn't go under control area */
  .center-wrapper {
    margin-right: 160px;
  }
  /* Play/Pause control button */
  #controlPlayButton {
    width: 48px;
    height: 48px;
    background: url('https://img.icons8.com/ios-filled/50/00ff00/play--v1.png') no-repeat center;
    background-size: contain;
    cursor: pointer;
    margin-bottom: 1rem;
    transition: background-image 0.3s ease;
  }
  #controlPlayButton.playing {
    background-image: url('https://img.icons8.com/ios-filled/50/00ff00/pause--v1.png');
  }

  /* Playlist toggle */
  #playlistToggleButton {
    width: 32px;
    height: 32px;
    margin-top: auto;
    background: url('https://img.icons8.com/ios-filled/50/00ff00/menu.png') no-repeat center;
    background-size: contain;
    cursor: pointer;
  }

  /* Playlist panel inside control */
  #playlistPanel {
    width: 100%;
    max-height: 50vh;
    overflow-y: auto;
    background: #111;
    border: 1px solid #00ff00;
    display: none;
    flex-direction: column;
    box-sizing: border-box;
    margin-bottom: 1rem;
  }
  #playlistPanel.visible {
    display: flex;
  }

  .playlist-title {
    color: #00ff00;
    font-weight: 700;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid #00ff00;
    font-family: 'Orbitron', sans-serif;
  }
  .playlist-entry {
    padding: 0.3rem 1rem;
    color: #ccc;
    cursor: pointer;
    border-bottom: 1px solid #002200;
    user-select: none;
  }
  .playlist-entry:hover {
    background: #003300;
    color: #00ff00;
  }

  /* Vertical skin list */
  #skinList {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    color: #00ff00;
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    user-select: none;
  }
  #skinList li {
    padding: 0.4rem 1rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: border-color 0.3s ease;
  }
  #skinList li:hover,
  #skinList li.active {
    border-left-color: #00ff00;
    background: #002200;
  }

  /* Hide the original select but keep it for script */
  #skinSelect {
    display: none !important;
  }

  /* Prevent feathers overlapping control area */
  .feather-container {
    pointer-events: none;
    overflow: visible;
    position: fixed;
    top: 0;
    left: 0;
    right: 160px; /* prevent over control */
    height: 100vh;
    z-index: 50;
  }
</style>
</head>
<body>

<video id="metalBgVideo" autoplay muted loop playsinline
  style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-1;">
  <source src="https://www.dropbox.com/scl/fi/92390f6gk9vs09i0q9133/172090-846482763.mp4?rlkey=tkuh9m9r8pi4osph44d1n882h&raw=1" type="video/mp4" />
</video>

<!-- Hidden original select for skin switching -->
<select id="skinSelect">
  <option value="styles/styles" selected>Default</option>
  <option value="styles/skin-retro">Retro</option>
  <option value="styles/skin-angel">Angel</option>
  <option value="styles/skin-haunted">Haunted</option>
  <option value="styles/skin-metal">Metal</option>
  <option value="styles/skin-steel">Steel</option>
  <option value="styles/skin-neon">Neon</option>
  <option value="styles/skin-storytellerz">Storytellerz</option>
</select>

<!-- Control Area -->
<div id="controlArea" aria-label="Control Area">
  <div id="controlPlayButton" title="Play / Pause"></div>

  <div id="playlistPanel" aria-label="Playlist Panel">
    <div class="playlist-title">PLAYLIST</div>
    <div id="playlistEntries"></div>
  </div>

  <div id="playlistToggleButton" title="Toggle Playlist"></div>

  <ul id="skinList" aria-label="Skin Selection">
    <li data-skin="styles/styles" class="active">Default</li>
    <li data-skin="styles/skin-retro">Retro</li>
    <li data-skin="styles/skin-angel">Angel</li>
    <li data-skin="styles/skin-haunted">Haunted</li>
    <li data-skin="styles/skin-metal">Metal</li>
    <li data-skin="styles/skin-steel">Steel</li>
    <li data-skin="styles/skin-neon">Neon</li>
    <li data-skin="styles/skin-storytellerz">Storytellerz</li>
  </ul>
</div>

<!-- Floating Feathers / Skulls -->
<div class="feather-container">
  <div class="feather f1"></div>
  <div class="feather f2"></div>
  <div class="feather f3"></div>
  <div class="feather f4"></div>
  <div class="feather f5"></div>
</div>

<!-- Wrapper to center the UI and prevent shifting -->
<div class="center-wrapper">
  <div class="container">
    <div class="left-section">
      <div class="lyrics-box" id="lyricsBox">
        <div class="lyrics-inner" id="lyricsInner">Loading lyrics…</div>
      </div>

      <div class="player-wrapper">
        <!-- Keep original play button hidden for script -->
        <div class="play-button" id="playButton" style="display:none;"></div>

        <div class="custom-player">
          <div class="time" id="currentTime">0:00</div>
          <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressFill"></div>
          </div>
          <div class="time" id="duration">0:00</div>
        </div>
      </div>
    </div>

    <div class="metadata">
      <img id="coverArt" class="cover" src="" alt="Cover Art" />
      <div class="metadata-card">
        <div class="scale-wrapper">
          <div class="title" id="songTitle">Loading title…</div>
        </div>
        <div class="scale-wrapper">
          <div class="artist" id="artistName">Loading artist…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Audio Element -->
<audio id="audioPlayer"></audio>

<!-- CSV Parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Your main script -->
<script src="scripts/script.js"></script>

<script>
  // Sync play/pause control button with audio
  const audio = document.getElementById('audioPlayer');
  const controlPlayBtn = document.getElementById('controlPlayButton');
  const playlistToggleButton = document.getElementById('playlistToggleButton');
  const playlistPanel = document.getElementById('playlistPanel');
  const skinList = document.getElementById('skinList');
  const skinSelect = document.getElementById('skinSelect');
  const themeLink = document.getElementById('theme-link');
  const body = document.body;
  const metalBgVideo = document.getElementById('metalBgVideo');

  // Play/pause toggle from control button
  controlPlayBtn.addEventListener('click', () => {
    if(audio.paused) audio.play();
    else audio.pause();
  });

  // Update controlPlayBtn icon when audio plays or pauses
  audio.addEventListener('play', () => {
    controlPlayBtn.classList.add('playing');
  });
  audio.addEventListener('pause', () => {
    controlPlayBtn.classList.remove('playing');
  });

  // Playlist toggle
  playlistToggleButton.addEventListener('click', () => {
    if(playlistPanel.classList.contains('visible')){
      playlistPanel.classList.remove('visible');
      playlistPanel.classList.add('fadeout');
      setTimeout(() => {
        playlistPanel.style.display = 'none';
        playlistPanel.classList.remove('fadeout');
      }, 300);
    } else {
      playlistPanel.style.display = 'flex';
      playlistPanel.classList.remove('fadeout');
      playlistPanel.classList.add('visible');
    }
  });

  // Skin list click sync with hidden select & update theme
  skinList.addEventListener('click', (e) => {
    if(e.target.tagName !== 'LI') return;

    // Remove active class from all
    skinList.querySelectorAll('li').forEach(li => li.classList.remove('active'));
    e.target.classList.add('active');

    const skinPath = e.target.getAttribute('data-skin');
    skinSelect.value = skinPath; // sync hidden select
    themeLink.href = skinPath + '.css';

    // Update body class for skin effects (optional)
    updateBodySkinClass(skinPath);
  });

  // Sync hidden select change (if any)
  skinSelect.addEventListener('change', () => {
    const val = skinSelect.value;
    themeLink.href = val + '.css';
    updateBodySkinClass(val);

    // Sync skinList highlight
    skinList.querySelectorAll('li').forEach(li => {
      li.classList.toggle('active', li.getAttribute('data-skin') === val);
    });
  });

  // On load, set skin to selected value and highlight skinList
  window.addEventListener('DOMContentLoaded', () => {
    const val = skinSelect.value;
    themeLink.href = val + '.css';

    skinList.querySelectorAll('li').forEach(li => {
      li.classList.toggle('active', li.getAttribute('data-skin') === val);
    });

    updateBodySkinClass(val);
  });

  // Same skin class update function from your script
  function updateBodySkinClass(cssPath) {
    const match = cssPath.match(/skin-(\w+)/);
    const skinClass = match ? `theme-${match[0]}` : '';
    body.className = skinClass;

    if(metalBgVideo){
      if(skinClass === 'theme-skin-metal'){
        metalBgVideo.style.display = 'block';
      } else {
        metalBgVideo.style.display = 'none';
      }
    }

    if(skinClass === 'theme-skin-angel'){
      startFeathers();
    } else {
      stopFeathers();
    }
  }

  // Feather effects functions from your script
  let featherInterval;
  const featherCount = 15;
  const featherImages = [
    'https://cdn-icons-png.flaticon.com/512/616/616408.png',
    'https://cdn-icons-png.flaticon.com/512/616/616407.png',
  ];

  function startFeathers() {
    stopFeathers();
    for(let i=0; i<featherCount; i++) createFeather();
    featherInterval = setInterval(() => createFeather(), 1000);
  }
  function stopFeathers() {
    clearInterval(featherInterval);
    document.querySelectorAll('.angel-feather').forEach(el => el.remove());
  }
  function createFeather() {
    const feather = document.createElement('div');
    feather.className = 'angel-feather';
    feather.style.setProperty('--dur', `${5 + Math.random() * 10}s`);
    feather.style.width = `${20 + Math.random() * 25}px`;
    feather.style.height = 'auto';
    const imgUrl = featherImages[Math.floor(Math.random() * featherImages.length)];
    feather.style.backgroundImage = `url(${imgUrl})`;

    const startX = Math.random() * window.innerWidth;
    const startY = window.innerHeight + 50;
    feather.style.left = `${startX}px`;
    feather.style.top = `${startY}px`;

    document.body.appendChild(feather);

    const duration = parseFloat(feather.style.getPropertyValue('--dur'));
    const endX = startX + (Math.random() * 200 - 100);
    const endY = -100;

    requestAnimationFrame(() => {
      feather.style.transition = `transform ${duration}s linear, opacity ${duration}s linear`;
      feather.style.transform = `translate(${endX - startX}px, ${endY - startY}px) rotate(${Math.random() * 360}deg)`;
      feather.style.opacity = '0';
    });

    setTimeout(() => {
      feather.remove();
    }, duration * 1000);
  }
</script>

</body>
</html>
